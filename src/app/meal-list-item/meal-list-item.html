<div class="meal-card" (click) = toggle()>

  <h3 appHighlight>{{ meal().strMeal | titlecase }}</h3>

  @if (meal().strMealThumb; as imageUrl_) {
    <img class="meal-image"
         [src]="imageUrl_"
         [alt]="meal().strMeal" />
  }

  @if (meal().strCategory) {
    <p>Category: {{ meal().strCategory }}</p>
  }

  @if (meal().strArea) {
    <p>Origin: {{ meal().strArea | uppercase }}</p>
  }

  @if (meal().strTags) {
    <p>Tags: {{ meal().strTags | sort }}</p>
  }

  <a [routerLink]="['/meals', meal().idMeal]">View Details</a>

  <button type="button" appConfirm="Delete this meal?" (confirmed)= "remove()">
    Remove
  </button>
</div>
