<h2>Meals from {{ strCountry() }}</h2>


<div class="search-bar">
  <input #c [value]="strCountry()" (keyup.enter)="strCountry.set(c.value)" aria-label="Country" />
  <button type="button" (click)="strCountry.set(c.value)">Search</button>
</div>

@if (meals.isLoading()) {
  <p>Loading Meals...</p>
} @else if (meals.error()) {
  <p class="error">Could not load meals. Check your connection.</p>
  <button type="button" (click)="meals.reload()">Try again</button>
} @else {
  @for (m of meals.value(); track m.idMeal) {
    <app-meal-list-item [meal]="m" (opened)="onMealOpened($event)" />
  } @empty {
    <p>No meals found from {{ strCountry() }}.</p>
  }
}
