<h2>Meals from {{ strArea() }}</h2>


<div class="search-bar">
  <input #c [value]="strArea()" (keyup.enter)="strArea.set(c.value); search()" aria-label="Area" />
  <button type="button" (click)="strArea.set(c.value); search()">Search</button>
</div>

@if (isLoading()) {
  <p>Loading...</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
  <button type="button" (click)="search()">Try Again</button>
} @else {
  <p>Total Meals: {{ meals().length | number:'1.0-1' }}</p>
  @for ( m of meals(); track m.idMeal) {
    <app-meal-list-item
      [meal]="m"
      highlightColor="#FDE7C8"
      (opened)="onMealOpened($event)"
      (removed)="handleMealEvent($event)"
    />
  } @empty {
    <p>No meals found from {{ strArea() }}.</p>
  }
}
